{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Assignment | Teacher</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{% static 'css/edit_assignment.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="page-wrapper">

        <div class="assignment-card">

            <div class="header">
                <h1>📄 Edit Assignment</h1>
                <p>Edit and upload a new assignment</p>
            </div>

            <form action="{% url 'edit_assignments' data.id %}" method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="input-group">
                    <label>Assignment Title</label>
                    <input name="title" type="text" placeholder="e.g. Introduction to Python" value="{{data.title}}"
                        required>
                </div>

                <div class="input-group">
                    <label>Assignment PDF</label>

                    {% if data.assignment %}
                    <p class="file-link">
                        Current file:
                        <a href="{{ data.assignment.url }}" target="_blank">
                            {{data.assignment}}
                        </a>
                    </p>
                    {% endif %}

                    <input name="assignment" type="file" accept="application/pdf" class="file-input">
                    <small>Upload only if you want to replace the existing file</small>
                </div>


                <div class="input-group">
                    <label>Due Date & Time</label>
                    <input name="due_date" type="datetime-local" value="{{data.due_date|date:'Y-m-d\\TH:i'}}" required>
                </div>

                <div class="form-actions">
                    <a href="{% url 'dashboard' %}">
                        <button type="button" class="secondary-btn">Cancel</button>
                    </a>
                    <button type="submit" class="primary-btn">Update Assignment</button>
                </div>

            </form>

        </div>

    </div>

</body>

</html>
